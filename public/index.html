<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vòng nhân bản bánh rán</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/game.js"></script>
</head>
<body>
  <!-- One 16:9 screen that scales to the projector like a slide: the shop, the top bar and the dialog box. -->
  <div id="stage">
    <canvas id="scene" width="1152" height="648" aria-hidden="true"></canvas>
    <div id="overlay"></div>

    <header id="hud">
      <div class="params box">
        <div class="param"><span class="lbl">u<sub>1</sub></span><span class="opts" data-param="u1"></span></div>
        <div class="param"><span class="lbl">q</span><span class="opts" data-param="q"></span></div>
      </div>
      <div class="title box">
        <img class="school-logo" src="assets/logo_truong.png" alt="Trường THPT chuyên Hà Nội – Amsterdam">
        <div class="tx">
          <div class="name">Vòng nhân bản bánh rán</div>
          <div class="info">Giáo viên: Trần Phương Nga · Lớp: 11 Sử 2 · Ngày: 10/11/2026</div>
        </div>
      </div>
      <button class="sysbtn" id="bFull" title="Toàn màn hình (phím F)" aria-label="Toàn màn hình"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0h4v1H1v3H0zM6 0h4v4H9V1H6zM0 6h1v3h3v1H0zM9 6h1v4H6V9h3z"/></svg></button>
    </header>

    <footer id="dialog" class="box">
      <div class="say" id="say"></div>
      <div class="controls">
        <button class="btn main" id="bNext"></button>
        <div class="row">
          <button class="btn" id="bGeneral" hidden>Khái quát đến ô thứ n</button>
          <button class="btn" id="bReset">Làm lại</button>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
